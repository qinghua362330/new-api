name: Build verified NewAPI WebSocket artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Write immutable build version
        run: printf '%s\n' "v1.0.0-rc.22-ws-${GITHUB_SHA::8}" > VERSION

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image without registry credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: qinghua362330/new-api:ws-${{ inputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export image and provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          docker save "qinghua362330/new-api:ws-${SOURCE_SHA}" | gzip -1 > artifact/new-api-linux-amd64.tar.gz
          sha256sum artifact/new-api-linux-amd64.tar.gz > artifact/SHA256SUMS
          cat > artifact/BUILD-METADATA.txt <<EOF
          source_sha=${SOURCE_SHA}
          image_tag=qinghua362330/new-api:ws-${SOURCE_SHA}
          platform=linux/amd64
          version=$(cat VERSION)
          EOF

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-ws-${{ inputs.source_sha }}-linux-amd64
          path: artifact/
          retention-days: 3
